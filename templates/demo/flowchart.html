{% extends "base_app.html" %}
{% block title %}Flowchart — SVEND{% endblock %}

{% block extra_head %}
<style>
body > main { padding: 0 !important; }
body > main > .container { max-width: none !important; padding: 0 !important; }

/* ── Layout ───────────────────────────────────────────── */
.fc-app {
    display: grid;
    grid-template-columns: 240px 1fr 300px;
    grid-template-rows: auto 1fr;
    height: calc(100vh - 56px);
    overflow: hidden;
}

.fc-toolbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    min-height: 40px;
}

.fc-toolbar h1 {
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-label);
    color: var(--text-primary);
    margin: 0;
    white-space: nowrap;
}

.fc-toolbar .fc-template-name {
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--font-label);
}

.fc-toolbar .fc-spacer { flex: 1; }

.fc-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-label);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    background: var(--bg-secondary);
    color: var(--text-primary);
}
.fc-btn:hover { border-color: var(--text-dim); }
.fc-btn:disabled { opacity: 0.5; cursor: wait; }

.fc-btn-primary {
    background: var(--accent-primary);
    color: var(--accent-primary-text, #fff);
    border-color: transparent;
}
.fc-btn-primary:hover { opacity: 0.9; }

/* ── Template Picker (left sidebar) ──────────────────── */
.fc-sidebar {
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
}

.fc-sidebar h2 {
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-label);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 10px;
}

.fc-tpl-card {
    padding: 10px 12px;
    background: var(--bg-primary, #1a1a1a);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
}
.fc-tpl-card:hover { border-color: var(--accent-primary-border); }
.fc-tpl-card.active { border-color: var(--accent-primary); }

.fc-tpl-card .name {
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-label);
    color: var(--text-primary);
    margin-bottom: 4px;
}

.fc-tpl-card .desc {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.fc-tpl-card .devices {
    margin-top: 6px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}

.fc-tpl-card .device-tag {
    font-size: 10px;
    font-family: var(--font-mono, monospace);
    padding: 2px 6px;
    background: var(--bg-secondary);
    border-radius: 3px;
    color: var(--text-dim);
}

/* ── SVG Canvas ──────────────────────────────────────── */
.fc-canvas-wrap {
    position: relative;
    overflow: hidden;
    background: var(--bg-primary, #111);
}

.fc-canvas-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* Grid pattern */
.fc-grid-pattern line {
    stroke: var(--border);
    stroke-width: 0.5;
    opacity: 0.3;
}

/* Device shapes */
.fc-device {
    cursor: pointer;
}

.fc-device rect.body {
    rx: 8;
    ry: 8;
    fill: var(--bg-secondary);
    stroke: var(--border);
    stroke-width: 1.5;
    transition: stroke 0.15s;
}

.fc-device:hover rect.body { stroke: var(--text-dim); }
.fc-device.selected rect.body { stroke: var(--accent-primary); stroke-width: 2; }
.fc-device.completed rect.body { stroke: #22c55e; stroke-width: 2; }
.fc-device.failed rect.body { stroke: #ef4444; stroke-width: 2; }
.fc-device.running rect.body {
    stroke: var(--accent-primary);
    stroke-width: 2;
    stroke-dasharray: 6 3;
    animation: fc-dash 0.8s linear infinite;
}
@keyframes fc-dash { to { stroke-dashoffset: -9; } }

.fc-device text.label {
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-label);
    fill: var(--text-primary);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

.fc-device text.plugin-name {
    font-size: 9px;
    font-family: var(--font-mono, monospace);
    fill: var(--text-dim);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

/* Ports */
.fc-port {
    cursor: default;
}

.fc-port circle {
    stroke: var(--bg-primary, #111);
    stroke-width: 2;
    r: 5;
}

.fc-port text {
    font-size: 8px;
    font-family: var(--font-mono, monospace);
    fill: var(--text-dim);
    pointer-events: none;
}

/* Connections */
.fc-connection {
    fill: none;
    stroke-width: 2;
    opacity: 0.7;
}
.fc-connection:hover { opacity: 1; stroke-width: 2.5; }

/* ── Detail Panel (right sidebar) ────────────────────── */
.fc-panel {
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
}

.fc-panel.empty {
    display: flex;
    align-items: center;
    justify-content: center;
}

.fc-panel .empty-msg {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    font-family: var(--font-label);
}

.fc-panel h2 {
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-label);
    color: var(--text-primary);
    margin: 0 0 4px;
}

.fc-panel .device-plugin {
    font-size: 11px;
    font-family: var(--font-mono, monospace);
    color: var(--text-dim);
    margin-bottom: 16px;
}

.fc-panel h3 {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-label);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 16px 0 8px;
}

.fc-panel h3:first-of-type { margin-top: 0; }

/* Config form */
.fc-config-field {
    margin-bottom: 10px;
}

.fc-config-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-label);
    color: var(--text-dim);
    margin-bottom: 4px;
}

.fc-config-field input,
.fc-config-field textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 10px;
    font-size: 12px;
    font-family: var(--font-mono, monospace);
    background: var(--bg-primary, #111);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
}

.fc-config-field textarea {
    height: 80px;
    resize: vertical;
}

.fc-config-field input:focus,
.fc-config-field textarea:focus {
    outline: none;
    border-color: var(--accent-primary-border);
}

/* Port list in panel */
.fc-port-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.fc-port-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 12px;
    font-family: var(--font-mono, monospace);
    color: var(--text-secondary, #ccc);
}

.fc-port-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}

.fc-port-type {
    font-size: 10px;
    color: var(--text-dim);
}

/* Output results */
.fc-result-card {
    padding: 10px 12px;
    background: var(--bg-primary, #111);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
}

.fc-result-card .key {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-label);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 4px;
}

.fc-result-card .value {
    font-size: 18px;
    font-weight: 700;
    font-family: var(--font-mono, monospace);
    color: var(--text-primary);
}

.fc-result-card .chart-slot {
    min-height: 180px;
}

.fc-result-card .text-value {
    font-size: 12px;
    color: var(--text-secondary, #ccc);
    line-height: 1.5;
    white-space: pre-wrap;
}

/* Status indicators */
.fc-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: var(--font-label);
    padding: 3px 8px;
    border-radius: 3px;
    margin-bottom: 12px;
}

.fc-status.completed {
    background: rgba(34, 197, 94, 0.1);
    color: #22c55e;
}

.fc-status.failed {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
}

.fc-status.running {
    background: rgba(59, 130, 246, 0.1);
    color: #3b82f6;
}
</style>
{% endblock %}

{% block content %}
<div class="fc-app" id="fcApp">
    <!-- Toolbar -->
    <div class="fc-toolbar">
        <h1>Flowchart</h1>
        <span class="fc-template-name" id="fcTemplateName">Select a template</span>
        <span class="fc-spacer"></span>
        <button class="fc-btn fc-btn-primary" id="fcRunBtn" disabled>Run</button>
    </div>

    <!-- Left: Template picker -->
    <div class="fc-sidebar" id="fcSidebar">
        <h2>Templates</h2>
        <div id="fcTemplateList"></div>
    </div>

    <!-- Center: SVG canvas -->
    <div class="fc-canvas-wrap" id="fcCanvasWrap">
        <svg id="fcSvg" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="fcGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <line x1="20" y1="0" x2="20" y2="20" class="fc-grid-pattern"/>
                    <line x1="0" y1="20" x2="20" y2="20" class="fc-grid-pattern"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#fcGrid)" opacity="0.3"/>
            <g id="fcConnectionsLayer"></g>
            <g id="fcDevicesLayer"></g>
        </svg>
    </div>

    <!-- Right: Detail panel -->
    <div class="fc-panel empty" id="fcPanel">
        <div class="empty-msg">Select a device to see details</div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ── Constants ─────────────────────────────────────────
    var DEVICE_W = 180;
    var DEVICE_H = 80;
    var PORT_R = 5;
    var PORT_SPACING = 20;
    var PORT_LABEL_OFFSET = 14;

    // ── State ─────────────────────────────────────────────
    var state = {
        templates: [],
        activeTemplate: null,
        definition: null,
        selectedDevice: null,
        results: null,
        running: false,
    };

    // ── DOM refs ──────────────────────────────────────────
    var templateList = document.getElementById('fcTemplateList');
    var templateName = document.getElementById('fcTemplateName');
    var runBtn = document.getElementById('fcRunBtn');
    var svg = document.getElementById('fcSvg');
    var connectionsLayer = document.getElementById('fcConnectionsLayer');
    var devicesLayer = document.getElementById('fcDevicesLayer');
    var panel = document.getElementById('fcPanel');

    // ── Helpers ───────────────────────────────────────────
    function getCookie(name) {
        var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return m ? decodeURIComponent(m[2]) : null;
    }

    async function api(method, url, body) {
        var opts = {
            method: method,
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        };
        if (body) opts.body = JSON.stringify(body);
        var resp = await fetch(url, opts);
        var data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Request failed');
        return data;
    }

    function portColor(typeStr, portColors) {
        if (!typeStr || !portColors) return '#666';
        var cat = typeStr.split(':')[0];
        return portColors[cat] || '#666';
    }

    // ── Template Picker ───────────────────────────────────
    async function loadTemplates() {
        var data = await api('GET', '/api/flowchart/templates/');
        state.templates = data.templates;
        renderTemplateList();
    }

    function renderTemplateList() {
        templateList.innerHTML = '';
        state.templates.forEach(function(tpl) {
            var card = document.createElement('div');
            card.className = 'fc-tpl-card';
            card.dataset.id = tpl.id;

            var name = document.createElement('div');
            name.className = 'name';
            name.textContent = tpl.name;
            card.appendChild(name);

            var desc = document.createElement('div');
            desc.className = 'desc';
            desc.textContent = tpl.description;
            card.appendChild(desc);

            var devices = document.createElement('div');
            devices.className = 'devices';
            (tpl.devices_used || []).forEach(function(d) {
                var tag = document.createElement('span');
                tag.className = 'device-tag';
                tag.textContent = d;
                devices.appendChild(tag);
            });
            card.appendChild(devices);

            card.addEventListener('click', function() { selectTemplate(tpl.id); });
            templateList.appendChild(card);
        });
    }

    async function selectTemplate(id) {
        // Fetch full definition
        var data = await api('GET', '/api/flowchart/templates/' + id + '/');
        state.activeTemplate = data;
        state.definition = data.definition;
        state.results = null;
        state.selectedDevice = null;

        // Update UI
        templateName.textContent = data.name;
        runBtn.disabled = false;
        document.querySelectorAll('.fc-tpl-card').forEach(function(c) {
            c.classList.toggle('active', c.dataset.id === id);
        });

        renderFlowchart();
        renderPanel();
    }

    // ── SVG Rendering ─────────────────────────────────────
    function renderFlowchart() {
        var def = state.definition;
        if (!def) return;

        // Clear layers
        connectionsLayer.innerHTML = '';
        devicesLayer.innerHTML = '';

        var devices = def.devices || [];
        var connections = def.connections || [];
        var positions = def.positions || {};
        var portColors = def.port_colors || {};

        // Compute port positions for each device
        var portPositions = {};

        devices.forEach(function(dev) {
            var pos = positions[dev.id] || { x: 100, y: 100 };
            var ports = dev.ports || { inputs: [], outputs: [] };
            var inputs = ports.inputs || [];
            var outputs = ports.outputs || [];

            // Calculate port y-offsets (centered vertically)
            var maxPorts = Math.max(inputs.length, outputs.length, 1);
            var deviceH = Math.max(DEVICE_H, maxPorts * PORT_SPACING + 20);

            // Render device group
            var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'fc-device');
            g.setAttribute('data-id', dev.id);
            g.setAttribute('transform', 'translate(' + pos.x + ',' + pos.y + ')');

            // Body rect
            var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('class', 'body');
            rect.setAttribute('x', 0);
            rect.setAttribute('y', 0);
            rect.setAttribute('width', DEVICE_W);
            rect.setAttribute('height', deviceH);
            g.appendChild(rect);

            // Label
            var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('class', 'label');
            label.setAttribute('x', DEVICE_W / 2);
            label.setAttribute('y', deviceH / 2 - 6);
            label.textContent = dev.label || dev.plugin;
            g.appendChild(label);

            // Plugin name (small)
            var pname = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            pname.setAttribute('class', 'plugin-name');
            pname.setAttribute('x', DEVICE_W / 2);
            pname.setAttribute('y', deviceH / 2 + 10);
            pname.textContent = dev.plugin;
            g.appendChild(pname);

            // Input ports (left side)
            inputs.forEach(function(port, i) {
                var py = computePortY(i, inputs.length, deviceH);
                var color = portColor(port.type, portColors);
                var pg = renderPort(0, py, port.name, color, 'input');
                g.appendChild(pg);
                portPositions[dev.id + '.' + port.name] = {
                    x: pos.x, y: pos.y + py
                };
            });

            // Output ports (right side)
            outputs.forEach(function(port, i) {
                var py = computePortY(i, outputs.length, deviceH);
                var color = portColor(port.type, portColors);
                var pg = renderPort(DEVICE_W, py, port.name, color, 'output');
                g.appendChild(pg);
                portPositions[dev.id + '.' + port.name] = {
                    x: pos.x + DEVICE_W, y: pos.y + py
                };
            });

            // Click handler
            g.addEventListener('click', function(e) {
                e.stopPropagation();
                state.selectedDevice = dev.id;
                renderDeviceSelection();
                renderPanel();
            });

            devicesLayer.appendChild(g);
        });

        // Render connections
        connections.forEach(function(conn) {
            var srcPos = portPositions[conn.source];
            var tgtPos = portPositions[conn.target];
            if (!srcPos || !tgtPos) return;

            var color = portColor(conn.type, portColors);
            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('class', 'fc-connection');
            path.setAttribute('stroke', color);
            path.setAttribute('d', cubicBezier(srcPos, tgtPos));

            // Tooltip
            var title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            title.textContent = conn.source + ' \u2192 ' + conn.target + ' (' + conn.type + ')';
            path.appendChild(title);

            connectionsLayer.appendChild(path);
        });

        // Click canvas to deselect
        svg.addEventListener('click', function() {
            state.selectedDevice = null;
            renderDeviceSelection();
            renderPanel();
        });
    }

    function computePortY(index, total, deviceH) {
        if (total <= 1) return deviceH / 2;
        var usable = deviceH - 30;
        var step = usable / (total - 1);
        return 15 + index * step;
    }

    function renderPort(x, y, name, color, side) {
        var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'fc-port');

        var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('fill', color);
        g.appendChild(circle);

        var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('y', y);
        text.setAttribute('dominant-baseline', 'middle');
        if (side === 'input') {
            text.setAttribute('x', x + PORT_LABEL_OFFSET);
            text.setAttribute('text-anchor', 'start');
        } else {
            text.setAttribute('x', x - PORT_LABEL_OFFSET);
            text.setAttribute('text-anchor', 'end');
        }
        text.textContent = name;
        g.appendChild(text);

        return g;
    }

    function cubicBezier(src, tgt) {
        var dx = Math.abs(tgt.x - src.x) * 0.5;
        return 'M ' + src.x + ' ' + src.y +
               ' C ' + (src.x + dx) + ' ' + src.y +
               ', ' + (tgt.x - dx) + ' ' + tgt.y +
               ', ' + tgt.x + ' ' + tgt.y;
    }

    function renderDeviceSelection() {
        document.querySelectorAll('.fc-device').forEach(function(g) {
            var id = g.getAttribute('data-id');
            g.classList.toggle('selected', id === state.selectedDevice);

            // Apply result status
            if (state.results && state.results[id]) {
                var status = state.results[id].status;
                g.classList.toggle('completed', status === 'completed');
                g.classList.toggle('failed', status === 'failed');
                g.classList.toggle('running', status === 'running');
            }
        });
    }

    // ── Detail Panel ──────────────────────────────────────
    function renderPanel() {
        if (!state.selectedDevice || !state.definition) {
            panel.className = 'fc-panel empty';
            panel.innerHTML = '<div class="empty-msg">Select a device to see details</div>';
            return;
        }

        panel.className = 'fc-panel';
        var dev = state.definition.devices.find(function(d) { return d.id === state.selectedDevice; });
        if (!dev) return;

        var config = (state.definition.config || {})[dev.id] || {};
        var portColors = state.definition.port_colors || {};
        var result = state.results ? state.results[dev.id] : null;

        var html = '';
        html += '<h2>' + escHtml(dev.label || dev.plugin) + '</h2>';
        html += '<div class="device-plugin">' + escHtml(dev.plugin) + '</div>';

        // Status
        if (result) {
            html += '<div class="fc-status ' + result.status + '">';
            html += result.status;
            if (result.duration_ms != null) html += ' \u2014 ' + result.duration_ms + 'ms';
            html += '</div>';
        }

        // Config
        var configKeys = Object.keys(config);
        if (configKeys.length > 0 || !result) {
            html += '<h3>Configuration</h3>';
            html += '<div id="fcConfigForm">';
            configKeys.forEach(function(key) {
                var val = config[key];
                html += '<div class="fc-config-field">';
                html += '<label>' + escHtml(key) + '</label>';
                if (typeof val === 'string' && val.length > 50) {
                    html += '<textarea data-key="' + escHtml(key) + '">' + escHtml(val) + '</textarea>';
                } else {
                    html += '<input data-key="' + escHtml(key) + '" value="' + escHtml(String(val === null ? '' : val)) + '">';
                }
                html += '</div>';
            });
            if (configKeys.length === 0) {
                html += '<div style="font-size:11px;color:var(--text-dim)">No configuration needed</div>';
            }
            html += '</div>';
        }

        // Ports
        var ports = dev.ports || { inputs: [], outputs: [] };
        if (ports.inputs && ports.inputs.length) {
            html += '<h3>Inputs</h3>';
            html += '<ul class="fc-port-list">';
            ports.inputs.forEach(function(p) {
                var color = portColor(p.type, portColors);
                html += '<li>';
                html += '<span class="fc-port-dot" style="background:' + color + '"></span>';
                html += '<span>' + escHtml(p.name) + '</span>';
                html += '<span class="fc-port-type">' + escHtml(p.type) + (p.multi ? ' (multi)' : '') + '</span>';
                html += '</li>';
            });
            html += '</ul>';
        }
        if (ports.outputs && ports.outputs.length) {
            html += '<h3>Outputs</h3>';
            html += '<ul class="fc-port-list">';
            ports.outputs.forEach(function(p) {
                var color = portColor(p.type, portColors);
                html += '<li>';
                html += '<span class="fc-port-dot" style="background:' + color + '"></span>';
                html += '<span>' + escHtml(p.name) + '</span>';
                html += '<span class="fc-port-type">' + escHtml(p.type) + '</span>';
                html += '</li>';
            });
            html += '</ul>';
        }

        // Results
        if (result && result.outputs) {
            html += '<h3>Results</h3>';
            var outputs = result.outputs;
            Object.keys(outputs).forEach(function(key) {
                var val = outputs[key];
                html += '<div class="fc-result-card">';
                html += '<div class="key">' + escHtml(key) + '</div>';
                if (typeof val === 'number') {
                    html += '<div class="value">' + formatNum(val) + '</div>';
                } else if (val && typeof val === 'object' && val.chart_type) {
                    // ForgeViz chart
                    html += '<div class="chart-slot" data-chart="' + escHtml(JSON.stringify(val)) + '"></div>';
                } else if (val && typeof val === 'object' && val.text) {
                    html += '<div class="text-value">' + escHtml(val.text) + '</div>';
                } else if (val && typeof val === 'object') {
                    html += '<div class="text-value">' + escHtml(JSON.stringify(val, null, 2)) + '</div>';
                } else {
                    html += '<div class="text-value">' + escHtml(String(val)) + '</div>';
                }
                html += '</div>';
            });
        }

        panel.innerHTML = html;

        // Bind config change handlers
        panel.querySelectorAll('#fcConfigForm input, #fcConfigForm textarea').forEach(function(el) {
            el.addEventListener('change', function() {
                var key = el.dataset.key;
                var val = el.value;
                // Try to parse as number
                var num = parseFloat(val);
                if (!isNaN(num) && String(num) === val.trim()) val = num;
                if (!state.definition.config[dev.id]) state.definition.config[dev.id] = {};
                state.definition.config[dev.id][key] = val;
            });
        });

        // Render ForgeViz charts
        panel.querySelectorAll('.chart-slot[data-chart]').forEach(function(slot) {
            try {
                var chartData = JSON.parse(slot.dataset.chart);
                if (typeof ForgeViz !== 'undefined' && ForgeViz.render) {
                    ForgeViz.render(slot, chartData, { theme: 'svend_dark' });
                }
            } catch (e) { /* skip */ }
        });
    }

    function escHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    function formatNum(n) {
        if (n === null || n === undefined) return '-';
        if (Number.isInteger(n)) return String(n);
        return n.toFixed(4).replace(/\.?0+$/, '');
    }

    // ── Execution ─────────────────────────────────────────
    runBtn.addEventListener('click', async function() {
        if (!state.definition || state.running) return;
        state.running = true;
        state.results = null;
        runBtn.disabled = true;
        runBtn.textContent = 'Running\u2026';

        // Clear device states
        document.querySelectorAll('.fc-device').forEach(function(g) {
            g.classList.remove('completed', 'failed', 'running');
            g.classList.add('running');
        });

        try {
            var data = await api('POST', '/api/flowchart/run/', {
                definition: state.definition,
                is_scratch: true,
            });
            state.results = data.results;

            // Update device states
            renderDeviceSelection();

            // If a device is selected, refresh panel with results
            if (state.selectedDevice) renderPanel();

        } catch (err) {
            // Mark all as failed on error
            document.querySelectorAll('.fc-device').forEach(function(g) {
                g.classList.remove('running');
                g.classList.add('failed');
            });
            alert('Execution failed: ' + err.message);
        } finally {
            state.running = false;
            runBtn.disabled = false;
            runBtn.textContent = 'Run';
            // Remove running class
            document.querySelectorAll('.fc-device.running').forEach(function(g) {
                g.classList.remove('running');
            });
        }
    });

    // ── Boot ──────────────────────────────────────────────
    loadTemplates();
})();
</script>
{% endblock %}
